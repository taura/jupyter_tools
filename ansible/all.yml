---

- name: basics
  hosts: default
  vars_files: [ vars/basics.yml ]
  roles:
    - basics

- name: nfs server
  hosts: nfs_server
  roles:
    - nfs_server
    - attach_home

- name: nfs client
  hosts: nfs_client
  roles:
    - nfs_client

# ldap_server が slapd の TLS にこのホストの証明書 (roles/cert) を使うので、
# LDAP より先に証明書を用意する。
- name: apache
  hosts: web_server
  vars_files: [ vars/cert.yml ]
  roles:
    - apache
    - cert

- name: ldap server
  hosts: ldap_server
  vars_files: [ vars/ldap.yml ]
  roles:
    - ldap_server

- name: ldap client
  hosts: ldap_client
  vars_files: [ vars/ldap.yml ]
  roles:
    - ldap_client

- name: ldap users
  hosts: ldap_server
  vars_files: [ vars/ldap.yml ]
  roles:
    - ldap_users

- name: invalidate sss cache
  hosts: ldap_client
  roles:
    - sss_invalidate

- name: make ldap_sudo sudoers
  hosts: ldap_client
  roles:
    - ldap_sudo
