---

- name: basics
  hosts: default
  vars_files: [ vars/basics.yml ]
  roles:
    - basics

- name: nfs server
  hosts: nfs_server
  roles:
    - nfs_server
    - attach_home

- name: nfs client
  hosts: nfs_client
  roles:
    - nfs_client

# Before LDAP: ldap_server uses this host's certificate (roles/cert) for slapd TLS.
- name: apache
  hosts: web_server
  vars_files: [ vars/cert.yml ]
  roles:
    - apache
    - cert

- name: ldap server
  hosts: ldap_server
  vars_files: [ vars/ldap.yml ]
  roles:
    - ldap_server

- name: ldap client
  hosts: ldap_client
  vars_files: [ vars/ldap.yml ]
  roles:
    - ldap_client

- name: ldap users
  hosts: ldap_server
  vars_files: [ vars/ldap.yml ]
  roles:
    - ldap_users

- name: invalidate sss cache
  hosts: ldap_client
  roles:
    - sss_invalidate

- name: make ldap_sudo sudoers
  hosts: ldap_client
  roles:
    - ldap_sudo

# Root-only parts of LiteLLM (PostgreSQL, linger, Apache proxy).
# After apache/cert (adds an Include to default-ssl.conf).
- name: litellm
  hosts: litellm_host
  vars_files: [ vars/litellm.yml ]
  roles:
    - litellm

# Root-only parts of Open WebUI (linger, Apache TLS termination).
# After apache/cert (uses the certificate).
- name: open webui
  hosts: open_webui_host
  roles:
    - open_webui

# JupyterHub itself (root). Students' environment: ../singleuser/install as share.
# After apache/cert (uses the certificate).
- name: jupyterhub
  hosts: jupyterhub_host
  vars_files: [ vars/jupyterhub.yml ]
  roles:
    - jupyterhub
