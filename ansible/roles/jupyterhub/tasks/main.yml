---
# tasks file for jupyterhub
#
# Only the one-time, root-only parts of JupyterHub. Everything else lives in
# the checkout ({{ jupyterhub_repo }}/hub) and is updated with git pull:
#   hub/.venv            built by tau: cd hub && uv sync
#   hub/jupyterhub_config.py, hub/user_map.py   read directly from the checkout
#   hub/jupyterhub.env   secrets (tau writes it; not committed)
#   hub/state/           working directory, {{ jupyterhub_state_owner }}-owned (jupyterhub.sqlite, cookie secret, user_map.sqlite)
#
# This role:
#  - installs configurable-http-proxy (npm)
#  - installs the systemd unit pointing at the checkout, and enables it

#
# configurable-http-proxy
#
# Don't use apt's node-configurable-http-proxy: Ubuntu 26.04's 4.5.3 uses the
# old commander API and breaks with node-commander 14, crashing at startup with
#   TypeError: cli.version is not a function
# (taking the hub down with it). Install from npm, which bundles its own commander.
- name: remove the broken apt configurable-http-proxy
  apt:
    state: absent
    name: node-configurable-http-proxy

- name: install Node.js and npm
  apt:
    state: present
    name:
      - nodejs
      - npm

# npm's global prefix is /usr/local -> /usr/local/bin/configurable-http-proxy (in the unit's PATH)
- name: install configurable-http-proxy {{ configurable_http_proxy_version }}
  community.general.npm:
    name: configurable-http-proxy
    version: "{{ configurable_http_proxy_version }}"
    global: yes
  register: jupyterhub_chp

#
# unit
#
- name: put jupyterhub.service
  template:
    src: jupyterhub.service.j2
    dest: /etc/systemd/system/jupyterhub.service
    mode: "0644"
  register: jupyterhub_unit

- name: check the hub venv exists
  stat:
    path: "{{ jupyterhub_repo }}/hub/.venv/bin/jupyterhub"
  register: jupyterhub_venv

- name: check hub/jupyterhub.env exists
  stat:
    path: "{{ jupyterhub_repo }}/hub/jupyterhub.env"
  register: jupyterhub_envfile

- name: enable JupyterHub
  systemd:
    name: jupyterhub
    enabled: yes
    daemon_reload: "{{ jupyterhub_unit is changed }}"
  # on a first --check, the unit isn't installed yet
  ignore_errors: "{{ ansible_check_mode }}"

- name: tell what is missing before the hub can start
  debug:
    msg: >-
      Not starting the hub yet: create {{ jupyterhub_repo }}/hub/.venv (cd hub && uv sync)
      and hub/jupyterhub.env (from hub/jupyterhub.env.example), then
      sudo systemctl start jupyterhub.
  when: not (jupyterhub_venv.stat.exists and jupyterhub_envfile.stat.exists)

# Restart only when the proxy or the unit changed; config changes in the
# checkout are applied with "sudo systemctl restart jupyterhub" by hand.
# A restart also stops running students' servers; don't run during class.
- name: start or restart JupyterHub
  systemd:
    name: jupyterhub
    state: "{{ 'restarted' if (jupyterhub_chp is changed or jupyterhub_unit is changed) else 'started' }}"
  when: jupyterhub_venv.stat.exists and jupyterhub_envfile.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"
