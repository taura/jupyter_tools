---
# tasks file for ldap_client

- name: install LDAP client packages
  apt:
    state: present
    name:
      - sssd
      - sssd-tools
      - ldap-utils

#
# OpenLDAP クライアント (ldapsearch 等) 用の設定。
# ldaptool もここから BASE を拾う。
#
# 以前は /etc/ldap.conf を lineinfile で作って、それを /etc/ldap/ldap.conf に
# コピーしていた。/etc/ldap.conf は旧 nss_ldap / pam_ldap 用の設定で、
# Ubuntu 26.04 でそれを作る ldap-auth-config パッケージごと消えたため、
# 本来の /etc/ldap/ldap.conf を直接書くようにした。
#
# /etc/ldap.secret の生成もやめた。書き込みは ldapi:// + SASL EXTERNAL
# (root のみ) で行うので、cn=admin のパスワードをディスクに置く必要がない。
# ACL の設定は roles/ldap_server を参照。
#
- name: put /etc/ldap/ldap.conf
  template:
    src: ldap.conf.j2
    dest: /etc/ldap/ldap.conf
    owner: root
    mode: "0644"
    backup: yes
  vars:
    ldap_server_name: "{{ hostvars[groups['ldap_server'][0]].fqdn }}"

- name: change /etc/pam.d/common-password
  lineinfile:
    path: /etc/pam.d/common-password
    backrefs: yes
    regexp: "^password(.*) use_authtok(.*)$"
    line:    'password\1 \2'
    backup: yes

- name: put sssd.conf
  template:
    src: templates/sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    mode: "0600"
  vars:
    ldap_server_name: "{{ hostvars[groups['ldap_server'][0]].fqdn }}"

- name: invalidate sss cache
  command: sss_cache -E

- name: restart sssd
  systemd:
    name: sssd
    state: restarted

#
# copy ldaptool
#
- name: git checkout
  git:
    repo: 'https://github.com/mdx-jp/ldaptool.git'
    dest: /opt/ldaptool

- name: copy ldaptool
  copy:
    remote_src: true
    src: /opt/ldaptool/bin
    dest: /usr/local/
    mode: preserve

