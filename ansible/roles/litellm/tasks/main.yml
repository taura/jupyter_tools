---
# tasks file for litellm
#
# The root-only parts of LiteLLM (../litellm). LiteLLM itself runs as a
# systemd user service of {{ litellm_user }} (no sudo), set up with
#   ./install deps && ./install service
#
# This role:
#  - installs PostgreSQL and creates the LiteLLM role and database
#  - enables linger for {{ litellm_user }} (user services run without a login)
#  - proxies /litellm/v1/ from the 443 vhost to LiteLLM

#
# PostgreSQL
#
- name: install PostgreSQL
  apt:
    state: present
    name:
      - postgresql
      # required by community.postgresql modules
      - python3-psycopg2

- name: start PostgreSQL
  systemd:
    name: postgresql
    state: started
    enabled: yes

# The OS user postgres is the DB superuser via peer auth.
# LiteLLM connects to 127.0.0.1:5432 with this role and password
# (scram-sha-256 is allowed by the default pg_hba.conf).
- name: create the LiteLLM database role
  community.postgresql.postgresql_user:
    name: "{{ litellm_db_user }}"
    password: "{{ litellm_db_password }}"
  become_user: postgres
  no_log: true

- name: create the LiteLLM database
  community.postgresql.postgresql_db:
    name: "{{ litellm_db_name }}"
    owner: "{{ litellm_db_user }}"
  become_user: postgres

#
# linger
#
# Without linger, {{ litellm_user }}'s user services stop at logout and
# don't start at boot.
- name: enable linger for {{ litellm_user }}
  command: loginctl enable-linger {{ litellm_user }}
  args:
    creates: /var/lib/systemd/linger/{{ litellm_user }}

#
# Apache
#
# Include it inside the 443 vhost. Do not a2enconf it from conf-available/:
# that would also expose LiteLLM over plain HTTP on :80
# (see the header of files/litellm-subpath.conf).
- name: enable Apache proxy modules
  apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_http
  register: litellm_apache_modules

- name: put /etc/apache2/litellm-subpath.conf
  copy:
    src: litellm-subpath.conf
    dest: /etc/apache2/litellm-subpath.conf
    mode: "0644"
  register: litellm_apache_conf

- name: include litellm-subpath.conf in the 443 vhost
  lineinfile:
    path: /etc/apache2/sites-available/default-ssl.conf
    line: "	Include /etc/apache2/litellm-subpath.conf"
    regexp: '^\s*Include\s+/etc/apache2/litellm-subpath\.conf'
    insertbefore: '^</VirtualHost>'
  register: litellm_apache_include

- name: check the Apache configuration
  command: apache2ctl configtest
  changed_when: false
  check_mode: false

- name: reload Apache
  systemd:
    name: apache2
    state: reloaded
  when: >-
    litellm_apache_modules is changed or
    litellm_apache_conf is changed or
    litellm_apache_include is changed
