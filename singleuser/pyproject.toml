[project]
name = "jupyter-tools-singleuser"
version = "0.1.0"
description = "Students' Jupyter server environment (jupyterhub-singleuser, JupyterLab, nbgrader, kernels)"

requires-python = ">=3.12,<3.13"

# Students' environment, separate from the hub (root): share-owned
# /home/share/venv/jupyter (./install), so share can update it without sudo.
# The hub itself is in ../hub.
#
# Keep the jupyterhub version identical to ../hub/pyproject.toml.
dependencies = [
    "jupyterhub==5.5.2",     # jupyterhub-singleuser
    "jupyterlab>=4.3,<5",    # nbgrader 0.9 needs JupyterLab 4
    "notebook>=7.3,<8",
    "nbgrader>=0.9.5",
    "ipywidgets",
    # kernels (./install registers their kernelspecs in the venv)
    "bash_kernel",
    "sos",
    "sos-notebook",
    "jupyterlab-sos",
    # libraries used in classes
    "numpy",
    "pandas",
    "matplotlib",
    "networkx",
    "pydot",
]

[tool.uv]
package = false
