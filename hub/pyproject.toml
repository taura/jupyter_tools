[project]
name = "jupyter-tools-hub"
version = "0.1.0"
description = "JupyterHub itself (run by root from this checkout)"

requires-python = ">=3.12,<3.13"

# Hub only; uv sync makes hub/.venv, which root runs straight from the checkout.
# Students' servers (jupyterhub-singleuser, jupyterlab, nbgrader, kernels) use a
# separate share-owned venv (../singleuser).
#
# Keep the jupyterhub version identical to ../singleuser/pyproject.toml.
#
# Stay on 5.x: 6.0 is untested with jupyterhub-multiauthenticator 0.4.0.
dependencies = [
    "jupyterhub==5.5.2",
    "oauthenticator>=17.4",
    "jupyterhub-multiauthenticator>=0.4.0",
]

[tool.uv]
package = false
