[project]
name = "jupyter-tools-hub"
version = "0.1.0"
description = "JupyterHub itself (runs as root; installed by ansible roles/jupyterhub)"

requires-python = ">=3.12,<3.13"

# Hub only. Run by root, so it goes in root-owned /opt/jupyterhub
# (uv sync by ansible roles/jupyterhub). Students' servers (jupyterhub-singleuser,
# jupyterlab, nbgrader, kernels) use a separate share-owned venv (../singleuser).
#
# Keep the jupyterhub version identical to ../singleuser/pyproject.toml.
#
# Stay on 5.x: 6.0 is untested with jupyterhub-multiauthenticator 0.4.0.
dependencies = [
    "jupyterhub==5.5.2",
    "oauthenticator>=17.4",
    "jupyterhub-multiauthenticator>=0.4.0",
]

[tool.uv]
package = false
