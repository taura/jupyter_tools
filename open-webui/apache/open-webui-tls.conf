# Open WebUI の前段で TLS を終端する Apache vhost
#
#   ブラウザ --https:3000--> Apache --http:8080--> open-webui (127.0.0.1)
#
# open-webui 自身は TLS を張れない (uvicorn.run に ssl_keyfile を渡していない)。
# 証明書は 443 の vhost と同じものを使い回す。
#
# 設置:
#   sudo cp open-webui-tls.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   echo "Listen 3000" | sudo tee /etc/apache2/conf-available/port-3000.conf
#   sudo a2enconf port-3000
#   sudo a2ensite open-webui-tls
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:3000>
    ServerName taulec.zapto.org

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/taulec.zapto.org/taulec.zapto.org.crt
    SSLCertificateKeyFile /etc/pki/tls/certs/taulec.zapto.org/taulec.zapto.org.key

    # open-webui は uvicorn を forwarded_allow_ips='*' で起動しているので、
    # ここで渡すヘッダを信用して https として振る舞う (__init__.py:81)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "3000"
    ProxyPreserveHost On

    # WebSocket (socket.io) を先に書く。順序が逆だと / に食われる
    ProxyPass        /ws/socket.io/ ws://127.0.0.1:8080/ws/socket.io/
    ProxyPassReverse /ws/socket.io/ ws://127.0.0.1:8080/ws/socket.io/

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # LLM の応答は SSE で長時間流れ続ける。既定の 60 秒では切れる
    ProxyTimeout 600

    ErrorLog  ${APACHE_LOG_DIR}/open-webui-error.log
    CustomLog ${APACHE_LOG_DIR}/open-webui-access.log combined
</VirtualHost>
