# LiteLLM を 443 のサブパス /litellm/ で公開する
#
#   ハーネス --https://taulec.zapto.org/litellm/v1--> Apache --http://127.0.0.1:4000/v1--> LiteLLM
#
# 既存の *:443 vhost の中に取り込む:
#   sudo cp litellm-subpath.conf /etc/apache2/
#   sudo $EDITOR /etc/apache2/sites-available/default-ssl.conf
#     → <VirtualHost *:443> ... </VirtualHost> の中に次の1行を足す
#         Include /etc/apache2/litellm-subpath.conf
#   sudo a2enmod proxy proxy_http     # 3000 番の設定で有効化済みなら不要
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# 注意: このファイルを conf-available/ に置いて a2enconf してはいけない。
#       サーバ全体に適用され、平文 HTTP の :80 でも LiteLLM が露出する。
#       必ず 443 の vhost の内側に Include すること。

# 公開するのは /v1/ だけ。
# Admin UI (/ui) や鍵管理 (/key/*, /user/*, /team/*, /spend/*) は転送しない。
# それらは master key があれば全学生の鍵を発行・閲覧できてしまうため、
# 引き続き 127.0.0.1 に閉じ、SSH トンネル経由でのみ触る:
#     ssh -L 4000:127.0.0.1:4000 taulec
#     → http://localhost:4000/ui/

# timeout=600 : LLM の応答は SSE で長時間流れる。Apache 既定の 60 秒では切れる。
#   ProxyTimeout ディレクティブは <Location> の中では使えない
#   ("ProxyTimeout not allowed in <Location> context")。
#   ProxyPass のパラメータとして書くと、この転送先にだけ効く。
ProxyPass        /litellm/v1/ http://127.0.0.1:4000/v1/ timeout=600 connectiontimeout=10
ProxyPassReverse /litellm/v1/ http://127.0.0.1:4000/v1/
